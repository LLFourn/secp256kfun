a2 := 0x02200000
@[a1, 32] := secret as x
assume x < 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141
@[a2, 32] := secret as y
assume y < 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141
halt at 0x0bad0000
explore all
