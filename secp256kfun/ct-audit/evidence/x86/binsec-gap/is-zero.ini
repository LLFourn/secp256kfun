starting from <audit_scalar_is_zero>
load sections .text, .rodata, .data, .got from file
rsp := 0x0000000008000008
@[rsp, 8] := 0x000000000bad0000
rdi := 0x0000000001000000
@[rdi, 32] := secret as scalar
assume scalar < 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141
halt at 0x000000000bad0000
explore all
